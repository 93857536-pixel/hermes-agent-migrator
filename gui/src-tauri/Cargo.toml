[package]
name = "hermes-agent-migrator-gui"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Hermes Agent Migrator — desktop GUI (Tauri v2)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
migrator-core = { path = "../../crates/migrator-core" }
