name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

jobs:
  test-core:
    name: Core engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      # Core + CLI + cloud server. The GUI crate needs platform system
      # libraries (GTK/webkit2gtk on Linux, the Windows resource pipeline,
      # etc.), which are covered by the dedicated GUI build jobs below.
      - name: Cargo clippy
        run: cargo clippy -p migrator-core -p hermes-migrator-cli -p hermes-cloud-server -- -D warnings

      - name: Cargo test
        run: cargo test -p migrator-core -p hermes-migrator-cli -p hermes-cloud-server

  build-gui:
    name: GUI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows installer is the CI target (macOS is also built locally);
        # Linux is covered by core tests only to avoid fragile rpm bundling.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      - name: Frontend typecheck + build
        working-directory: gui
        run: npm run build

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Tauri build
        working-directory: gui
        run: cargo tauri build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/**
          if-no-files-found: warn
