name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build + Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      - name: Frontend build
        working-directory: gui
        run: npm run build

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Tauri build
        working-directory: gui
        run: cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release create` shells out to `git` to validate `--target`; this
      # job otherwise has no checkout, so it dies with "not a git repository".
      # Providing one lets the idempotent delete/create work on the runner.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          mkdir -p dist
          # Windows: NSIS installer + portable; macOS: DMG
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp -f {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist/ 2>/dev/null)" || { echo "no installer artifacts found; refusing to publish an empty release"; exit 1; }
          # Resolve the tag to its commit via the API. This job has no
          # checkout, so `--target <tag-name>` (which needs local git) fails
          # with "not a git repository"; a raw commit SHA needs no git.
          # Annotated tags resolve to a tag object first — peel it.
          ref_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          sha="$(echo "$ref_json" | jq -r .object.sha)"
          otype="$(echo "$ref_json" | jq -r .object.type)"
          if [ "$otype" = "tag" ]; then
            sha="$(gh api "repos/$REPO/git/tags/$sha" --jq .object.sha)"
          fi
          echo "publishing $TAG at commit $sha"
          # Idempotent publish: if this tag's release already exists (CI
          # re-run), replace it in place instead of failing on the create.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing"
            gh release delete "$TAG" --yes || true
          fi
          gh release create "$TAG" \
            --title "$TAG — Hermes Agent Migrator" \
            --notes "Hermes Agent Migrator $TAG. Download the installer for your platform (Windows: .exe NSIS; macOS: .dmg)." \
            --target "$sha" \
            dist/*
